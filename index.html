<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>명언 생성기</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <main class="container">
      <section class="card quote-card" aria-labelledby="quote-generator-title">
        <h1 id="quote-generator-title" class="title">오늘의 명언</h1>

        <div id="authorPortraitWrap" class="author-portrait-wrap" hidden>
          <img id="authorPortraitImg" class="author-portrait" src="" alt="" width="96" height="96" />
        </div>

        <div id="quoteOutput" class="quote-output" aria-live="polite">
          버튼을 눌러 명언을 생성해보세요.
        </div>

        <p id="uiMessage" class="ui-message" aria-live="polite"></p>

        <div class="button-row" role="group" aria-label="명언 동작 버튼">
          <button id="nextQuoteBtn" type="button"><span aria-hidden="true">🔄</span> 다음 명언</button>
          <button id="saveQuoteBtn" type="button"><span aria-hidden="true">💾</span> 저장</button>
          <button id="shareQuoteBtn" type="button"><span aria-hidden="true">🔗</span> 공유</button>
        </div>

        <div id="shareOptions" class="share-options" role="group" aria-label="공유 옵션">
          <button id="shareEmailBtn" type="button">이메일</button>
          <button id="shareSnsBtn" type="button">SNS</button>
          <button id="shareUrlBtn" type="button">URL 복사</button>
        </div>

        <div class="saved-quotes-block" aria-labelledby="saved-quotes-title">
          <h2 id="saved-quotes-title" class="saved-quotes-heading">저장된 명언 목록</h2>
          <ul id="savedQuotesList" class="saved-quotes-list"></ul>
        </div>
      </section>

      <input id="keywordInput" type="text" class="hidden-input" autocomplete="off" />
      <button id="themeToggleBtn" type="button" class="hidden-control" aria-hidden="true" tabindex="-1">
        다크 테마
      </button>
    </main>

    <footer class="site-footer">
      <p class="site-footer__text">2026 오늘의 명언 Made with JJorifong</p>
    </footer>

    <script src="scripts/app.js"></script>
  </body>
</html>
